<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Bandwolf</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b1226; color:#f2f4f8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { text-align:center; padding:24px; max-width:360px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:#aab3c5; margin:0 0 24px; line-height:1.4; }
  a.btn { display:block; margin:0 0 12px; padding:14px 18px; border-radius:12px; background:#ffc845;
          color:#0b1226; font-weight:700; text-decoration:none; }
  a.btn.alt { background:#1a2340; color:#f2f4f8; border:1px solid #2c3a63; }
</style>
</head>
<body>
<main>
  <h1>Get Bandwolf</h1>
  <p>Install the app, open it, then enter your invite code to join your band.</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/id6760418427">Download for iPhone</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=app.bandwolf.bandwolf">Download for Android</a>
</main>
<script>
  // Send phones straight to the right store; anything else (desktop) sees both buttons.
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) location.replace(document.getElementById("ios").href);
  else if (isAndroid) location.replace(document.getElementById("android").href);
</script>
</body>
</html>
