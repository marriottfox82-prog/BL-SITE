<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Bandwolf</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0E17">
<link rel="icon" type="image/svg+xml" href="./bandwolf-icon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./site.css">
<style>
  .card{text-align:center}
  .card img{width:84px;height:84px;margin:0 auto 20px}
  .card .btn{display:flex;width:100%;padding:15px;font-size:1rem;margin-top:12px}
</style>
</head>
<body style="background:var(--gold)">
<main class="centre">
  <div class="card">
    <img src="./bandwolf-icon.svg" alt="" width="84" height="84">
    <h1>Get Bandwolf</h1>
    <p class="subtitle">Install the app, open it, then enter your invite code to join your band.</p>
    <a class="btn btn-ink" id="ios" href="https://apps.apple.com/app/id6760418427">Download for iPhone</a>
    <a class="btn btn-line" id="android" href="https://play.google.com/store/apps/details?id=app.bandwolf.bandwolf">Download for Android</a>
  </div>
</main>
<script>
  // Send phones straight to the right store; anything else (desktop) sees both buttons.
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) location.replace(document.getElementById("ios").href);
  else if (isAndroid) location.replace(document.getElementById("android").href);
</script>
</body>
</html>
