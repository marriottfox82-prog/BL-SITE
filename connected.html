<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bandwolf</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --surface: #0f1a2e;
    --accent: #FFC845;
    --success: #4caf82;
    --danger: #e05252;
    --muted: rgba(255,255,255,0.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  main { width: 100%; max-width: 360px; }
  .brand {
    display: block;
    height: 44px;
    width: auto;
    margin: 0 auto 48px;
  }
  .badge {
    width: 72px;
    height: 72px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--tone, var(--success));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .badge svg { width: 34px; height: 34px; stroke: var(--tone, var(--success)); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .badge svg path { display: none; }
  body[data-status="ok"] .badge .i-ok,
  body[data-status="cancelled"] .badge .i-cancelled,
  body[data-status="error"] .badge .i-error { display: block; }
  body[data-status="ok"] { --tone: var(--success); }
  body[data-status="cancelled"] { --tone: rgba(255,255,255,0.5); }
  body[data-status="error"] { --tone: var(--danger); }
  h1 {
    font-family: 'Nunito', -apple-system, sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    line-height: 1.2;
    margin: 0 0 10px;
  }
  p { margin: 0; font-size: 0.95rem; line-height: 1.55; color: var(--muted); }
</style>
</head>

<script>
(function () {
  // Words are drafted in the app's 8 languages; worth a quick native read-through.
  var T = {
    en: { ok: ["Connected", "You can return to Bandwolf now."],
          cancelled: ["Connection cancelled", "You can return to Bandwolf and try again any time."],
          error: ["Something went wrong", "Please return to Bandwolf and try again."] },
    fr: { ok: ["Connecté", "Vous pouvez retourner dans Bandwolf."],
          cancelled: ["Connexion annulée", "Vous pouvez retourner dans Bandwolf et réessayer à tout moment."],
          error: ["Un problème est survenu", "Veuillez retourner dans Bandwolf et réessayer."] },
    es: { ok: ["Conectado", "Ya puedes volver a Bandwolf."],
          cancelled: ["Conexión cancelada", "Puedes volver a Bandwolf e intentarlo de nuevo cuando quieras."],
          error: ["Algo salió mal", "Vuelve a Bandwolf e inténtalo de nuevo."] },
    de: { ok: ["Verbunden", "Du kannst jetzt zu Bandwolf zurückkehren."],
          cancelled: ["Verbindung abgebrochen", "Du kannst zu Bandwolf zurückkehren und es jederzeit erneut versuchen."],
          error: ["Etwas ist schiefgelaufen", "Bitte kehre zu Bandwolf zurück und versuche es erneut."] },
    pt: { ok: ["Conectado", "Já pode voltar ao Bandwolf."],
          cancelled: ["Ligação cancelada", "Pode voltar ao Bandwolf e tentar de novo quando quiser."],
          error: ["Algo correu mal", "Volte ao Bandwolf e tente novamente."] },
    "pt-br": { ok: ["Conectado", "Você já pode voltar ao Bandwolf."],
          cancelled: ["Conexão cancelada", "Você pode voltar ao Bandwolf e tentar de novo quando quiser."],
          error: ["Algo deu errado", "Volte ao Bandwolf e tente novamente."] },
    pl: { ok: ["Połączono", "Możesz teraz wrócić do Bandwolf."],
          cancelled: ["Połączenie anulowane", "Możesz wrócić do Bandwolf i spróbować ponownie w dowolnym momencie."],
          error: ["Coś poszło nie tak", "Wróć do Bandwolf i spróbuj ponownie."] },
    it: { ok: ["Connesso", "Ora puoi tornare a Bandwolf."],
          cancelled: ["Connessione annullata", "Puoi tornare a Bandwolf e riprovare quando vuoi."],
          error: ["Qualcosa è andato storto", "Torna a Bandwolf e riprova."] }
  };

  var params = new URLSearchParams(location.search);
  var status = params.get("status");
  if (status !== "cancelled" && status !== "error") status = "ok";

  var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();
  var key = T[lang] ? lang : T[lang.split("-")[0]] ? lang.split("-")[0] : "en";
  var copy = T[key][status];

  document.body.setAttribute("data-status", status);
  document.documentElement.lang = key === "pt-br" ? "pt-BR" : key;
  document.getElementById("title").textContent = copy[0];
  document.getElementById("message").textContent = copy[1];

  // Harmless if the browser refuses; the app closes this view itself once it has the login.
  try { window.close(); } catch (e) {}
})();
